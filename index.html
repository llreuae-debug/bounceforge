    <script>/* Boot shell: home shows the hero headline; studio/info routes show their real page heading; others a plain dark shell */
(function(){
  var p=location.pathname.replace(/^\/[a-z]{2}(-[A-Z]{2})?(?=\/|$)/,'').replace(/\/+$/,'');
  if(p===''||p==='/')return;
  var drops=['BounceForge 3D — Drop Studio','Pick a song, pick a drop style. The animation is built backwards from the beat, so every impact lands on its note — in preview and in the export.'];
  var map={'/drops':drops,'/drop-studio':drops,'/library':drops,'/midi-library':drops,'/drop-styles':drops,'/styles':drops,'/presets':drops,'/export':drops,
    '/midi':['MIDI → Reel Studio','Pick the music first. The ball-drop animation is generated to match it, with every major drop landing on the beat.'],
    '/credits':['Credits & Licenses','Every built-in song is either a public-domain composition (composer died more than 100 years ago, or a traditional tune first published more than 100 years ago) newly sequenced by the BounceForge team from the original score, or an original BounceForge melody. All instrument sounds come from BounceForge\'s own synthesizer — no samples from recordings.']};
  map['/licenses']=map['/credits'];
  map['/studio']=map['/create']=map['/settings']=['BounceForge Studio','Pick a reel, tune the physics and sound, then export a 9:16 video up to 4K. Loading the studio…'];
  var s=document.getElementById('boot-shell');if(!s)return;

  if(!t){s.innerHTML='';return;}

  var q=document.createElement('p');q.textContent=t[1];q.style.cssText='font-size:14px;color:#94a3b8;max-width:1100px;width:100%;margin:0 auto;line-height:1.5;';
  s.appendChild(h);s.appendChild(q);
})();</script>
